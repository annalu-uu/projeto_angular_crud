    <div id="div-form">
        <h2>Cadastro de Clientes</h2>

        <form id="cadastro">
        <label for="nome">Nome</label>
        <input type="text" name="nome" [(ngModel)]="cliente.nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" [(ngModel)]="cliente.email">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" [(ngModel)]="cliente.cpf">

        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" [(ngModel)]="cliente.dataNascimento">

        <label for="uf">UF</label>
        <input type="text" id="uf" [(ngModel)]="cliente.uf">

        <label for="municipio">Município</label>
        <input type="text" id="municipio" [(ngModel)]="cliente.municipio">

        <button type="button">Salvar</button>
        <button type="reset">Limpar</button>
        </form>

        </div>

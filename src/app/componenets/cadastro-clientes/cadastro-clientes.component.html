<div id="div-form">

    <h2>Cadastro de Clientes</h2>

    <form id="cadastro" [formGroup]="formulario">

        <label for="nome">Nome</label>
        <input type="text" id="nome" formControlName="nome">


        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email">


        <label for="cpf">CPF</label>
        <input type="text" id="cpf" formControlName="cpf">


        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" formControlName="dataNascimento">


        <label for="uf">UF</label>
        <input type="text" id="uf" formControlName="uf">


        <label for="municipio">Município</label>
        <input type="text" id="municipio" formControlName="municipio">


        <button type="button" (click)="salvar()">Salvar</button>

        <button type="button" (click)="limpar()">Limpar</button>

    </form>

    <div id="div-lista">

        <h2>Lista de Clientes</h2>

        <!-- TABELA PARA MOSTRAR OS CLIENTES CADASTRADOS -->
        <table>

            <!-- CABEÇALHO DA TABELA -->
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>CPF</th>
                    <th>Data Nascimento</th>
                    <th>UF</th>
                    <th>Município</th>
                    <th>Ações</th>
                </tr>
            </thead>
    
             <!-- CORPO DA TABELA -->
            <tbody>

                 <!-- PERCORRE A LISTA DE CLIENTES E MOSTRA CADA UM -->
                @for(cliente of listaClientes; track $index){
    
                    <tr>
                         <!-- MOSTRA OS DADOS DO CLIENTE -->
                        <td>{{cliente.nome}}</td>
                        <td>{{cliente.email}}</td>
                        <td>{{cliente.cpf}}</td>
                        <td>{{cliente.dataNascimento}}</td>
                        <td>{{cliente.uf}}</td>
                        <td>{{cliente.municipio}}</td>
    
                        <td>
                            <button>
                                Editar
                            </button>
    
                            <button>
                                Excluir
                            </button>
                        </td>
    
                    </tr>
    
                }
    
            </tbody>
    
        </table>
    
    </div>

</div>

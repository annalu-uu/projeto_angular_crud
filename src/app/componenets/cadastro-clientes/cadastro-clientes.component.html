<div id="div-form">

    <h2>Cadastro de Clientes</h2>

    <form id="cadastro" [formGroup] = "formulario">

        <label for="nome">Nome</label>
        <input type="text" id="nome" formControlName="nome">


        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email">


        <label for="cpf">CPF</label>
        <input type="text" id="cpf" formControlName="cpf">


        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" formControlName="dataNascimento">


        <label for="uf">UF</label>

        <select id="uf" formControlName="uf" (change)="buscarMunicipios()">

            <option value="">
                Selecione a UF
            </option>

            <option *ngFor="let uf of ufs" [value]="uf">
                {{uf}}
            </option>

        </select>


        <label for="municipio">Município</label>

        <select id="municipio" formControlName="municipio">

            <option value="">
                Selecione o município
            </option>


            <option *ngFor="let municipio of municipios" [value]="municipio.nome">

                {{municipio.nome}}

            </option>

        </select>


        <button type="button" (click)="salvar()">Salvar</button>

        <button type="button" (click)="limpar()">Limpar</button>

    </form>
